# Matrix Pipeline v1.0 — State Machine Formal
# Define os estados, transições e fases do pipeline de 4 fases.
# Lido pelo @agents-orchestrator antes de cada ação.

pipeline:
  name: "Matrix 4-Phase Pipeline"
  version: "1.0"
  description: "State machine formal do pipeline Fable de 4 fases"
  start_state: "idle"
  end_states: ["completed", "failed", "escalated"]

  # ─── RUNTIME DEFAULT ────────────────────────────────────────────────
  # Porta de entrada padrão: pipeline-start.js
  # Uso: npm start | node pipeline/scripts/pipeline-start.js [--auto]
  runtime:
    default: "pipeline/scripts/pipeline-start.js"
    description: "Porta de entrada padrão — valida (8/8) + executa pipeline automaticamente"
    commands:
      - "npm start"                                                  # Modo interativo
      - "npm run start:auto"                                         # Modo automático
      - "node pipeline/scripts/pipeline-start.js --auto"             # Modo automático (direto)
      - "node pipeline/scripts/pipeline-start.js --validate"         # Só validar
      - "node pipeline/scripts/pipeline-start.js --reset"            # Reset forçado
      - "node pipeline/scripts/pipeline-start.js --state"            # Mostrar estado

  # ─── CONFIGURACAO DE PARALELISMO (OBRIGATORIO) ──────────────────────
  # REGRA R14: Sempre que houver 2+ tarefas independentes na Fase 2,
  # o orchestrator DEVE usar execucao paralela (maxWorkers=6).
  # Modo legacy (parallel.enabled=false) existe APENAS para compatibilidade
  # com pipelines legados. O padrao e SEMPRE paralelo.
  parallel:
    enabled: true                    # PADRAO: true. false = modo legacy (apenas excecao)
    max_workers: 6                   # MAXIMO ABSOLUTO: 6 agentes simultaneos
    mandatory: true                  # true = orchestrator DEVE usar paralelismo qdo 2+ tasks
    description: "Sempre que a todolist tiver 2+ tarefas independentes, o pipeline paralelo e OBRIGATORIO. Modo legacy (enabled=false) apenas para compatibilidade."

# ─── ESTADOS ────────────────────────────────────────────────────────────
# Cada estado tem: id, fase (agrupamento), descrição

states:
  - id: "idle"
    phase: "init"
    description: "Aguardando demanda do usuário"

  - id: "identifying"
    phase: "init"
    description: "Orchestrator identificou-se como @AgentsOrchestrator"

  - id: "obligations_created"
    phase: "init"
    description: "Todowrite de obrigações foi criada (10 itens)"

  - id: "obligations_verified"
    phase: "init"
    description: "Todos os itens de obrigação foram marcados como completed"

  - id: "fase1_analysis"
    phase: "fase_1"
    description: "FASE 1: @fable-method-agent delegado para análise (Steps 0-3)"

  - id: "todolist_created"
    phase: "fase_1"
    description: "FASE 1 COMPLETA: Todolist de tarefas foi criada pelo fable-method-agent"

  - id: "context_building"
    phase: "fase_2"
    description: "📦 Context Builder executando CB.1-CB.6: descoberta, pontuação, eliminação, ordenação, montagem"

  - id: "parallel_dispatch"
    phase: "fase_2"
    description: "Parallel Dispatch: Decomposicao + roteamento + preparacao de contexto individual"

  - id: "parallel_execution"
    phase: "fase_2"
    description: "Parallel Execution: Pool maxWorkers=6 executando agentes simultaneamente"

  - id: "parallel_merge"
    phase: "fase_2"
    description: "Parallel Merge: Consolidacao de resultados + deteccao de conflitos"

  - id: "fase2_execution"
    phase: "fase_2"
    description: "FASE 2: Especialista delegado com contexto otimizado para implementação (Steps 4-6)"

  - id: "fase2_complete"
    phase: "fase_2"
    description: "FASE 2 COMPLETA: Especialista concluiu e marcou tasks como completed"

  - id: "fase3_validation"
    phase: "fase_3"
    description: "FASE 3: @fable-judge delegado para verificação adversarial"

  - id: "fase3_approved"
    phase: "fase_3"
    description: "FASE 3 COMPLETA: Judge retornou VERIFIED ou CAVEATS"

  - id: "fase3_refuted"
    phase: "fase_3"
    description: "FASE 3 FALHOU: Judge retornou REFUTED ou VIOLATION → volta Fase 2"

  - id: "fase4_review"
    phase: "fase_4"
    description: "FASE 4: @code-reviewer delegado para revisão técnica"

  - id: "fase4_approved"
    phase: "fase_4"
    description: "FASE 4 COMPLETA: Code Review retornou APPROVED"

  - id: "fase4_changes_needed"
    phase: "fase_4"
    description: "FASE 4 FALHOU: Code Review retornou CHANGES_NEEDED → volta Fase 2"

  - id: "delivery"
    phase: "entrega"
    description: "Realizando git add + commit + push"

  - id: "reporting"
    phase: "entrega"
    description: "Gerando relatório final para o usuário"

  - id: "completed"
    phase: "final"
    description: "✅ Pipeline concluído com sucesso"

  - id: "failed"
    phase: "final"
    description: "❌ Pipeline falhou — estado de erro"

  - id: "escalated"
    phase: "final"
    description: "⚠️ Máx 3 tentativas excedido — escalado ao usuário"

# ─── TRANSIÇÕES ─────────────────────────────────────────────────────────
# Cada transição tem: from → to, condição (gatilho), fase executada

transitions:
  - from: "idle"
    to: "identifying"
    trigger: "Demanda do usuário recebida"
    action: "Identificar-se como @AgentsOrchestrator"

  - from: "identifying"
    to: "obligations_created"
    trigger: "Auto-identificação concluída"
    action: "Criar todowrite com 10 itens de obrigação"

  - from: "obligations_created"
    to: "obligations_verified"
    trigger: "Todos os itens da todowrite foram completados"
    action: "Verificar cada item e marcar como completed"

  - from: "obligations_verified"
    to: "fase1_analysis"
    trigger: "Obrigações verificadas com sucesso"
    action: "Delegar @fable-method-agent para Steps 0-3"

  - from: "fase1_analysis"
    to: "todolist_created"
    trigger: "@fable-method-agent criou todolist (todowrite)"
    action: "Validar que todolist tem fases nomeadas + especialistas"

  - from: "fase1_analysis"
    to: "failed"
    trigger: "Erro na análise ou fable-method-agent não respondeu"
    action: "Registrar falha"

  - from: "todolist_created"
    to: "context_building"
    trigger: "Todolist válida e pronta para execução"
    action: "Executar Context Builder (CB.1-CB.6): descobrir, pontuar, eliminar, ordenar, montar contexto otimizado"

  - from: "context_building"
    to: "fase2_execution"
    trigger: "Contexto otimizado montado com sucesso"
    action: "Delegar especialista da tabela de roteamento com contexto otimizado na task"

  - from: "context_building"
    to: "failed"
    trigger: "Erro no Context Builder (falha ao descobrir/pontuar arquivos)"
    action: "Registrar falha"

  - from: "context_building"
    to: "parallel_dispatch"
    trigger: "Contexto otimizado montado com sucesso (modo paralelo)"
    action: "Iniciar Parallel Dispatcher: decompor + rotear + preparar contexto individual"

  - from: "parallel_dispatch"
    to: "parallel_execution"
    trigger: "Dispatch concluido: tasks roteadas e contextos prontos"
    action: "Executar pool paralelo (maxWorkers=6)"

  - from: "parallel_execution"
    to: "parallel_merge"
    trigger: "Pool paralelo concluiu execucao"
    action: "Consolidar resultados, detectar conflitos, gerar relatorio"

  - from: "parallel_execution"
    to: "failed"
    trigger: "Pool paralelo falhou completamente (todas as tasks falharam)"
    action: "Registrar falha do pool paralelo"

  - from: "parallel_merge"
    to: "fase2_complete"
    trigger: "Merge concluido com sucesso (com ou sem conflitos menores)"
    action: "Fase 2 completa - resultados consolidados prontos para Judge"

  - from: "parallel_merge"
    to: "failed"
    trigger: "Merge detectou conflitos irresoluveis ou perda de dados"
    action: "Registrar falha do merge"

  - from: "fase2_execution"
    to: "fase2_complete"
    trigger: "Especialista concluiu, marcou tasks como completed"
    action: "Verificar identificação e conclusão do especialista"

  - from: "fase2_execution"
    to: "failed"
    trigger: "Especialista falhou ou não concluiu"
    action: "Registrar falha"

  - from: "fase2_complete"
    to: "fase3_validation"
    trigger: "Fase 2 concluída com sucesso"
    action: "Delegar @fable-judge para verificação adversarial"

  - from: "fase3_validation"
    to: "fase3_approved"
    trigger: "Judge retornou VERIFIED ou VERIFIED WITH CAVEATS"
    action: "Registrar aprovação do judge"

  - from: "fase3_validation"
    to: "fase3_refuted"
    trigger: "Judge retornou REFUTED ou VIOLATION"
    action: "Incrementar contador de tentativas"

  - from: "fase3_refuted"
    to: "fase2_execution"
    trigger: "Tentativas < 3"
    action: "Retornar para Fase 2 com feedback do judge"

  - from: "fase3_refuted"
    to: "escalated"
    trigger: "Tentativas >= 3"
    action: "Escalar ao usuário — max tentativas excedido"

  - from: "fase3_approved"
    to: "fase4_review"
    trigger: "Judge aprovou"
    action: "Delegar @code-reviewer para revisão técnica"

  - from: "fase4_review"
    to: "fase4_approved"
    trigger: "Code Review retornou APPROVED"
    action: "Registrar aprovação do code review"

  - from: "fase4_review"
    to: "fase4_changes_needed"
    trigger: "Code Review retornou CHANGES_NEEDED"
    action: "Incrementar contador de tentativas"

  - from: "fase4_changes_needed"
    to: "fase2_execution"
    trigger: "Tentativas < 3"
    action: "Retornar para Fase 2 com feedback do code review"

  - from: "fase4_changes_needed"
    to: "escalated"
    trigger: "Tentativas >= 3"
    action: "Escalar ao usuário — max tentativas excedido"

  - from: "fase4_approved"
    to: "delivery"
    trigger: "Code Review aprovou"
    action: "Executar git add + git commit + git push"

  - from: "delivery"
    to: "reporting"
    trigger: "Commit e push concluídos"
    action: "Gerar relatório final com agentes e skills utilizados"

  - from: "reporting"
    to: "completed"
    trigger: "Relatório entregue ao usuário"
    action: "Pipeline concluído"

  - from: "completed"
    to: "idle"
    trigger: "Novo ciclo do pipeline iniciado"
    action: "Reset state para idle — pipeline pronto para nova demanda"

  - from: "failed"
    to: "idle"
    trigger: "Reset manual do pipeline"
    action: "Reset state para idle"

  - from: "escalated"
    to: "idle"
    trigger: "Reset manual do pipeline"
    action: "Reset state para idle"

# ─── FASES AGRUPADAS ────────────────────────────────────────────────────
# Cada fase agrupa um conjunto de estados para verificação

phases:
  - name: "init"
    description: "Inicialização do pipeline"
    states: ["idle", "identifying", "obligations_created", "obligations_verified"]
    verification: "Orchestrator identificado + obrigações criadas e verificadas"
    checklist_ref: "init"

  - name: "fase_1"
    description: "Análise (Fable Method Steps 0-3)"
    states: ["fase1_analysis", "todolist_created"]
    verification: "Todolist criada com fases nomeadas, especialistas, tasks e verificação"
    checklist_ref: "fase_1"

  - name: "fase_2"
    description: "Execucao (Fable Method Steps 4-6) com Context Builder + Paralelismo"
    states: ["context_building", "parallel_dispatch", "parallel_execution", "parallel_merge", "fase2_execution", "fase2_complete"]
    verification: "Context Builder executado, dispatch paralelo, pool executou, merge consolidou"
    checklist_ref: "fase_2"

  - name: "fase_3"
    description: "Validação (Fable Judge)"
    states: ["fase3_validation", "fase3_approved", "fase3_refuted"]
    verification: "Judge re-executou verificações e entregou veredito"
    checklist_ref: "fase_3"

  - name: "fase_4"
    description: "Revisão (Code Review)"
    states: ["fase4_review", "fase4_approved", "fase4_changes_needed"]
    verification: "Code Review aprovou tecnicamente o código"
    checklist_ref: "fase_4"

  - name: "entrega"
    description: "Delivery e relatório"
    states: ["delivery", "reporting"]
    verification: "Commit + push + relatório entregue"
    checklist_ref: "entrega"

  - name: "final"
    description: "Estados finais"
    states: ["completed", "failed", "escalated"]
    verification: "Pipeline encerrado"
    checklist_ref: null
