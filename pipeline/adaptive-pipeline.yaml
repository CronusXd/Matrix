# =============================================================================
# Matrix Adaptive Pipeline v1.0
# =============================================================================
# Classificador deterministico de complexidade de tarefas.
# SEMPRE usa pipeline completo (medium) se incerto.
#
# Fluxo:
#   1. classify_before_fase1: classifica demanda textualmente
#   2. Escolhe config baseado na classificacao
#   3. Executa pipelines com ou sem saltos (judge/review)
#
# Override manual: --pipeline=simple|medium|complex
# =============================================================================

adaptive:
  enabled: true

  # ── Classificacao padrao segura ──
  # Se o classificador nao consegue determinar com confianca,
  # usa medium (pipeline completo com judge + review).
  default_classification: "medium"

  # ── Definicoes de classificacao ──
  classifications:
    simple:
      description: "1 arquivo, < 10 linhas, sem nova logica"
      skip_judge: true
      skip_code_review: true
      max_retries: 0
      phases:
        - init
        - fase1_quick          # Analise superficial
        - fase2_execution       # Execucao direta
        - verification          # Verificacao rapida
        - delivery              # Entrega

      # Gatilhos: se QUALQUER UM destes detectado
      triggers:
        - "typo|corrigir|ajustar|renomear"
        - "1 arquivo"
        - "descricao < 30 chars"

    medium:
      description: "2-5 arquivos, logica conhecida"
      skip_judge: false
      skip_code_review: false
      max_retries: 3
      phases:
        - init
        - fase1                 # Analise completa
        - fase2                 # Execucao
        - verification          # Verificacao
        - fase3                 # Judge (validacao)
        - fase4                 # Code review
        - delivery              # Entrega

      # Gatilho: fallback padrao
      triggers:
        - "default"

    complex:
      description: "Arquitetura nova, risco alto, multi-arquivo"
      skip_judge: false
      skip_code_review: false
      max_retries: 5
      require_design_doc: true   # Exige documento de design antes de executar
      phases:
        - init
        - fase1_deep             # Analise profunda
        - fase2                  # Execucao
        - verification           # Verificacao
        - fase3                  # Judge (validacao)
        - fase4                  # Code review
        - delivery               # Entrega

      # Gatilhos: precisa de 2+ destes para classificar como complex
      triggers:
        - "arquitetura|design|refatorar|migrar"
        - "seguranca|performance|escalar"
        - "3+ arquivos"

  # ── Configuracoes de avaliacao ──
  evaluation:
    # Classifica antes da Fase 1 para escolher pipeline
    classify_before_fase1: true

    # --pipeline=simple override manual
    override_with_flag: true

    # Loga a classificacao no events.log
    log_classification: true

  # ── Metricas de performance ──
  metrics:
    track_execution_time: true
    track_phase_duration: true
    alert_on_timeout: true
    timeout_seconds: 300       # 5 minutos por fase

  # ── Extensoes futuras ──
  extensions:
    custom_classifiers: []     # Placeholder para classificadores customizados
    pre_hooks: []              # Hooks antes da classificacao
    post_hooks: []             # Hooks depois da classificacao
