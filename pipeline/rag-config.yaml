# Matrix RAG Config v2.2 — Consulta Inteligente com Auto-Fallback
# Usado pelo @fable-method-agent durante Step 2 (Reunir Evidências)
#
# ═══════════════════════════════════════════════════════════════════════
#  🎯 Modos de Retrieval
# ═══════════════════════════════════════════════════════════════════════
#   "hybrid"     — ⭐ RECOMENDADO: TF-IDF (0.3) + Embeddings (0.7)     ⭐
#                  Requer Matrix_RAG_API_KEY no ambiente.
#                  Se a chave não estiver disponível →
#                  fallback automático para TF-IDF ✅
#
#   "tfidf"      — ✅ PADRÃO FUNCIONAL: TF-IDF puro
#                  Sem dependências, zero config, sempre funciona.
#                  Usado automaticamente como fallback quando a API
#                  key não está disponível.
#
#   "embeddings" — Apenas embeddings semânticos via API 9router
#                  Requer Matrix_RAG_API_KEY.
#                  Se a chave não estiver disponível →
#                  fallback automático para TF-IDF ✅
#
# ═══════════════════════════════════════════════════════════════════════
#  🔒 AUTO-FALLBACK (sempre ativo, sem quebra)
# ═══════════════════════════════════════════════════════════════════════
#   Se mode: "hybrid" e Matrix_RAG_API_KEY não disponível →
#     fallback automático para TF-IDF ✅
#   Se mode: "embeddings" e Matrix_RAG_API_KEY não disponível →
#     fallback automático para TF-IDF ✅
#   Se mode: "hybrid" e a API de embeddings falhar em runtime →
#     fallback automático para TF-IDF ✅ (implementado no código)
#
#   ⛑️ NENHUM modo quebra ou crasha sem API key.
#   O sistema SEMPRE degrada gracefulmente para TF-IDF.
#
# ═══════════════════════════════════════════════════════════════════════
#  📋 Passo a Passo: Ativar Embeddings (Modo Hybrid)
# ═══════════════════════════════════════════════════════════════════════
#   Este arquivo já está configurado com mode: "hybrid".
#   Para ativar os embeddings semânticos:
#
#   1️⃣ Obter chave de API (compatível OpenAI):
#        • 9Router (recomendado): https://9router.com
#        • OpenAI: https://platform.openai.com/api-keys
#
#   2️⃣ Configurar variável de ambiente:
#        Edite .env na raiz do projeto e adicione:
#          Matrix_RAG_API_KEY=sk-sua-chave-aqui
#
#   3️⃣ Executar script de setup automático:
#        node pipeline/scripts/setup-rag.js
#        (detecta a chave, testa conexão e ativa modo hybrid)
#
#   4️⃣ Verificar:
#        grep "mode:" pipeline/rag-config.yaml
#        # Deve exibir: mode: "hybrid"
#
#   5️⃣ (Opcional) Desativar embeddings:
#        node pipeline/scripts/setup-rag.js --force-tfidf
#        Ou edite manualmente mode para "tfidf".
#
#   🔄 ATENÇÃO: Mesmo com mode: "hybrid", se Matrix_RAG_API_KEY não
#      estiver definida, o sistema opera em TF-IDF sem erros.
#      A configuração "hybrid" é o ALVO; o fallback é automático.

rag:
  version: "2.2"
  enabled: true

  # Modo de retrieval — "hybrid" é o modo recomendado
  # 🔒 Auto-fallback GARANTIDO: se mode for "hybrid" ou "embeddings"
  #    e a API key não estiver disponível, o sistema usa TF-IDF
  #    automaticamente SEM QUEBRAR.
  #
  # ⚠️ Pode alterar para "tfidf" se quiser desabilitar embeddings
  #    permanentemente. O auto-fallback continua ativo em runtime.
  mode: "hybrid"

  # Embeddings via API 9router (compatível OpenAI)
  # Para ativar: defina Matrix_RAG_API_KEY no .env
  #   (veja "Passo a Passo" no topo deste arquivo)
  #
  # 🔄 Cadeia de fallback:
  #   1. Tenta usar api_key_env (Matrix_RAG_API_KEY)
  #   2. Se não encontrada → tenta api_key_fallback (string vazia)
  #   3. Se vazio → modo TF-IDF automaticamente
  embeddings:
    provider: "openai-compatible"
    base_url: "http://127.0.0.1:20128/v1"
    model: "kr/claude-sonnet-4.5-thinking-agentic"
    dimensions: 1536
    batch_size: 10
    api_key_env: "Matrix_RAG_API_KEY"
    api_key_fallback: ""  # vazio proposital — força fallback para TF-IDF

  # Processamento de documentos
  chunk_size: 1000        # caracteres por chunk
  chunk_overlap: 200       # sobreposição entre chunks
  max_chunks: 100          # máximo de chunks no índice
  top_k: 5                 # resultados por consulta

  # Diretórios a indexar
  include_patterns:
    - "*.md"
    - "**/*.md"
    - "**/*.js"
    - "**/*.py"
    - "**/*.yaml"
    - "**/*.json"
    - "docs/**/*.md"
    - "README*"
    - "pipeline/**/*.yaml"
    - "pipeline/**/*.js"

  # Diretórios a excluir
  exclude_patterns:
    - "node_modules/**"
    - ".git/**"
    - "__pycache__/**"
    - "*.pyc"
    - "build/**"
    - "dist/**"

  # Storage do índice
  index_file: "rag-index.json"
