# Matrix Memory Service v1.0 — Session Memory
# Desacoplada: troca de adaptador JSON → SQLite → PostgreSQL é simples.
# NENHUM agente acessa armazenamento diretamente — tudo passa pelo orchestrator.

service:
  name: "Matrix Memory Service"
  version: "1.0"
  description: "Persistência de decisões, contexto, preferências, histórico e checkpoints"

  # ─── ADAPTADOR DE ARMAZENAMENTO ─────────────────────────────────────
  # Altere storage.type para trocar de backend.
  storage:
    type: "json"                                  # ✅ PRIMÁRIO ATIVO — JSON puro, zero dependências
    file: "pipeline/memory.json"
    # type: "postgres"                           # 🔄 ALTERNATIVA DOCUMENTADA — requer DATABASE_URL
    #   connection_string: "${DATABASE_URL}"
    #   table_name: "memories"
    #   adapter: "scripts/pg-memory-adapter.js"
    # type: "sqlite"                              # 🔄 EXPERIMENTAL — requer Node v22.5+
    #   file: "pipeline/memory.db"
    #   ⚠️ ORPHANED: memory.db (94KB) foi removido em 28/07/2026 porque storage.type="json".
    #   Backup preservado em memory.db.backup. Nenhuma funcionalidade perdida.

  # ─── MAPA DE ADAPTADORES ────────────────────────────────────────────
  # type: "json"      → pipeline/memory.json   — memory-adapter.js v2.0 ✅ ATIVO (primário)
  # type: "postgres"  → DATABASE_URL + pg-memory-adapter.js v1.1 🔄 Alternativa (requer PostgreSQL)
  # type: "sqlite"    → pipeline/memory.db     ⚠️ Experimental — node:sqlite (requer Node v22.5+)

  # ─── INTERFACE PADRÃO ───────────────────────────────────────────────
  # Todo acesso à memória usa estes 5 métodos.
  # Apenas o @AgentsOrchestrator invoca — NENHUM outro agente.

  methods:
    read:
      description: "Ler valor da memória por namespace + chave"
      signature: "memory.read(namespace, key) → value | null"
      example: "memory.read('decisoes', 'abordagem_fase1') → 'usar fable-method-agent'"

    write:
      description: "Escrever valor na memória por namespace + chave"
      signature: "memory.write(namespace, key, value) → void"
      example: "memory.write('preferencias', 'modelo_preferido', 'claude-sonnet-4-6')"

    push:
      description: "Adicionar item a uma lista na memória (histórico)"
      signature: "memory.push(namespace, key, item) → void"
      example: "memory.push('historico', 'demandas', {tipo: 'task', descricao: 'corrigir bug'})"

    resume:
      description: "Recuperar contexto da última execução não-finalizada"
      signature: "memory.resume() → {last_state, last_demand, checkpoints} | null"
      example: "memory.resume() → {last_state: 'fase2_execution', last_demand: '...'}"

    checkpoint:
      description: "Salvar ponto de retomada para recovery"
      signature: "memory.checkpoint(state_id, snapshot) → void"
      example: "memory.checkpoint('fase2_complete', {task: 'implementar X', status: 'done'})"

  # ─── NAMESPACES ─────────────────────────────────────────────────────
  # Namespaces organizam a memória por tipo de dado.

  namespaces:
    - name: "decisoes"
      description: "Decisões arquiteturais e técnicas tomadas"
      ttl: "permanente"

    - name: "contexto"
      description: "Contexto do projeto e da demanda atual"
      ttl: "sessão"

    - name: "preferencias"
      description: "Preferências do usuário"
      ttl: "permanente"

    - name: "projeto"
      description: "Informações sobre o projeto atual (estrutura, arquitetura, dependências, configurações)"
      ttl: "permanente"
      auto_populate: true
      fields:
        - "nome"
        - "versao"
        - "linguagem_principal"
        - "estrutura_diretorios"
        - "dependencias_principais"
        - "arquitetura"
        - "configuracoes"

    - name: "historico"
      description: "Histórico de execuções, agentes usados, resultados"
      ttl: "30 dias"

    - name: "checkpoints"
      description: "Snapshots para retomada de execução"
      ttl: "7 dias"

  # ─── BACKUPS ────────────────────────────────────────────────────────
  backup:
    current: "pipeline/memory.json"
    backup: "pipeline/memory.json.backup"
    last_backup: "2026-07-28T13:58:00.000Z"
    note: "Backup gerado automaticamente em 28/07/2026. memory.db.backup (94KB, 26/07/2026) removido — SQLite não é mais usado."
    recovery: "Se memory.json for corrompido, copie memory.json.backup para memory.json"

  # ─── COMO ATIVAR POSTGRESQL ────────────────────────────────────────
  # Siga estes passos para trocar de JSON → PostgreSQL:
  #
  #   1. Garanta acesso a um PostgreSQL (local ou remoto)
  #   2. Defina DATABASE_URL no ambiente:
  #        set DATABASE_URL=postgresql://user:pass@localhost:5432/matrix_memory
  #   3. Execute o setup script (testa conexão, cria tabela, oferece migração):
  #        node pipeline/scripts/setup-pg-memory.js
  #   4. ⚠️ Apenas após o setup confirmar conexão OK:
  #      Edite este arquivo, descomente as linhas postgres abaixo e
  #      altere storage.type de "json" para "postgres".
  #   5. Reinicie o pipeline — o orchestrator carregará o pg-memory-adapter.js
  #
  #   📌 O fallback JSON permanece ativo mesmo com PostgreSQL.
  #      Se o PostgreSQL falhar em runtime, o adapter cai automaticamente
  #      para pipeline/memory.json (zero downtime).
  #
  #   📌 Para migrar dados existentes manualmente (sem o setup interativo):
  #        node pipeline/scripts/migrate-memory-to-pg.js
  #
  #   📌 Para testar a conexão PostgreSQL isoladamente:
  #        node pipeline/scripts/setup-pg-memory.js --no-migrate
  #
  #   Exemplo DATABASE_URL:
  #     postgresql://postgres:minha-senha@db.supabase.co:5432/postgres
  #     postgresql://user:pass@localhost:5432/matrix_memory?sslmode=require
  #

  # ─── REGRAS ─────────────────────────────────────────────────────────
  rules:
    - "NENHUM agente (fable-method, especialista, judge, code-reviewer) acessa memory.json diretamente"
    - "TODO acesso passa pelo @AgentsOrchestrator via os 5 métodos da interface"
    - "memory.write() sobrescreve valor existente na mesma namespace+key"
    - "memory.push() adiciona a uma lista — não sobrescreve"
    - "Se storage.type == 'postgres': opera via pg-memory-adapter.js (fallback JSON automático)"
    - "Se storage.type == 'json': opera em pipeline/memory.json"
    - "Migração: memory.json ↔ PostgreSQL via pipeline/scripts/migrate-memory-to-pg.js"
