# Matrix Release Pipeline v1.0 — State Machine
# Define os estados, transições e fases do pipeline de release automatizado.
# Lido pelo @agents-orchestrator durante o fluxo de release.

pipeline:
  name: "Matrix Release Pipeline"
  version: "1.0"
  description: "State machine do pipeline de release automatizado"
  start_state: "idle"
  end_states: ["completed", "failed", "escalated"]

# ─── ESTADOS ────────────────────────────────────────────────────────────
# Cada estado tem: id, fase (agrupamento), descrição

states:
  - id: "idle"
    phase: "init"
    description: "Aguardando solicitação de release"

  - id: "version_bump"
    phase: "prep"
    description: "Atualizando versão no version_file e no CHANGELOG"

  - id: "changelog"
    phase: "prep"
    description: "Gerando changelog da release"

  - id: "tag"
    phase: "prep"
    description: "Criando tag git (vX.Y.Z)"

  - id: "build"
    phase: "build"
    description: "Executando hooks de pre-release e build"

  - id: "deploy"
    phase: "build"
    description: "Publicando release (GitHub Release + hooks post-release)"

  - id: "completed"
    phase: "final"
    description: "✅ Release concluída com sucesso"

  - id: "failed"
    phase: "final"
    description: "❌ Release falhou"

  - id: "escalated"
    phase: "final"
    description: "⚠️ Máx 3 tentativas excedido"

# ─── TRANSIÇÕES ─────────────────────────────────────────────────────────
# Cada transição tem: from → to, condição (gatilho), ação executada

transitions:
  - from: "idle"
    to: "version_bump"
    trigger: "Solicitação de release"
    action: "Ler versão atual, incrementar"

  - from: "version_bump"
    to: "changelog"
    trigger: "Versão atualizada"
    action: "Gerar/atualizar CHANGELOG.md"

  - from: "version_bump"
    to: "failed"
    trigger: "Erro no version bump"
    action: "Registrar falha"

  - from: "changelog"
    to: "tag"
    trigger: "Changelog atualizado"
    action: "git tag vX.Y.Z"

  - from: "changelog"
    to: "failed"
    trigger: "Erro no changelog"
    action: "Registrar falha"

  - from: "tag"
    to: "build"
    trigger: "Tag criada"
    action: "Executar pre_release_hooks"

  - from: "tag"
    to: "failed"
    trigger: "Erro na tag"
    action: "Registrar falha"

  - from: "build"
    to: "deploy"
    trigger: "Build concluído"
    action: "Publicar GitHub Release"

  - from: "build"
    to: "failed"
    trigger: "Erro no build"
    action: "Registrar falha"

  - from: "deploy"
    to: "completed"
    trigger: "Release publicada"
    action: "Pipeline concluído"

  - from: "deploy"
    to: "failed"
    trigger: "Erro no deploy"
    action: "Registrar falha"

  - from: "failed"
    to: "idle"
    trigger: "Reset manual"
    action: "Reset state"

  - from: "escalated"
    to: "idle"
    trigger: "Reset manual"
    action: "Reset state"

# ─── HOOKS ──────────────────────────────────────────────────────────────
# Hooks executados durante o pipeline de release.
# Definidos no release-config.yaml, referenciados aqui para state machine.

hooks:
  pre_release:
    description: "Hooks executados antes do build (ex: testes, lint)"
    config_ref: "release-config.yaml → pre_release_hooks"
    execution_point: "antes da transição tag → build"
    on_failure: "Transição para 'failed'"

  post_release:
    description: "Hooks executados após o deploy (ex: notificações)"
    config_ref: "release-config.yaml → post_release_hooks"
    execution_point: "após a transição deploy → completed"
    on_failure: "Não crítico — aviso apenas"

# ─── FASES AGRUPADAS ────────────────────────────────────────────────────
# Cada fase agrupa um conjunto de estados para verificação

phases:
  - name: "init"
    description: "Inicialização do release"
    states: ["idle"]
    verification: "Release solicitada"
    checklist_ref: "release_init"

  - name: "prep"
    description: "Preparação da release (version bump, changelog, tag)"
    states: ["version_bump", "changelog", "tag"]
    verification: "Versão, changelog e tag prontos"
    checklist_ref: "release_prep"

  - name: "build"
    description: "Build e deploy da release"
    states: ["build", "deploy"]
    verification: "Build e deploy concluídos"
    checklist_ref: "release_build"

  - name: "final"
    description: "Estados finais do release"
    states: ["completed", "failed", "escalated"]
    verification: "Release encerrada"
    checklist_ref: null
