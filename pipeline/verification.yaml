# Matrix Verification Layer v1.0
# ================================================================
# Executa verificacoes objetivas automaticamente apos a Fase 2.
# NON-BLOCKING: se falhar, pipeline continua com aviso.
#
# Integracao:
#   O VerificationRunner (scripts/verification-runner.js) le esta
#   configuracao e executa cada comando em paralelo via Promise.all.
#
# Estados possiveis:
#   - passed:  todas as verificacoes obrigatorias OK
#   - failed:  alguma verificacao obrigatoria falhou
#   - skipped: projeto sem os scripts/configuracoes necessarias
# ================================================================

verification:
  # Habilita/desabilita a camada inteira
  enabled: true

  # ----------------------------------------------------------------------
  # Comandos de verificacao
  # ----------------------------------------------------------------------
  # Cada comando e executado com execSync() com timeout configuravel.
  # O sufixo "|| true" garante que erro de exit code nao quebre o pipe.
  # Comandos que nao existirem no package.json serao pulados
  # automaticamente com status "skipped".
  # ----------------------------------------------------------------------
  commands:
    # Testes unitarios/integracao
    # Usa --reporter=json para output estruturado (parseavel)
    tests: "npm test -- --reporter=json 2>&1 || true"

    # Build da aplicacao
    build: "npm run build 2>&1 || true"

    # Linter (ESLint, Prettier, etc)
    lint: "npm run lint -- --format=json 2>&1 || true"

    # TypeScript type checking
    # Ignorado automaticamente se nao houver tsconfig.json
    typecheck: "npx tsc --noEmit 2>&1 || true"

  # ----------------------------------------------------------------------
  # Opcoes de execucao
  # ----------------------------------------------------------------------
  options:
    # Timeout em milissegundos para cada comando individual
    timeout_per_command: 60000

    # Numero maximo de linhas capturadas do stdout/stderr por comando
    max_output_lines: 500

    # Se true, falha em testes impede o pipeline de avancar
    # Recomendado: false (non-blocking — pipeline continua com aviso)
    block_on_test_failure: false

    # Se true, falha no build impede o pipeline de avancar
    # Recomendado: true (build quebrado deve bloquear)
    block_on_build_failure: true

    # Se true, erros de lint impedem o pipeline de avancar
    # Recomendado: false (lint e informativo, non-blocking)
    block_on_lint_errors: false

    # Se true, salva resultados no memory.json para uso por outros agentes
    save_results_to_memory: true

    # Se true, executa todos os comandos em paralelo via Promise.all
    parallel_execution: true

  # ----------------------------------------------------------------------
  # Regras de aprovacao (approval)
  # ----------------------------------------------------------------------
  # Define quais combinacoes de resultado sao aceitaveis para que o
  # pipeline considere a verificacao como "passed".
  # ----------------------------------------------------------------------
  approval:
    # Lista de verificacoes obrigatorias para passar
    required:
      - tests
      - build

    # Lista de verificacoes informativas (nao bloqueiam)
    optional:
      - lint
      - typecheck

    # Se true, skipped e considerado passed para verificacoes required
    allow_skipped_as_passed: true
