# Matrix Observability v1.0 — Configuração de Telemetria
# Desacoplada do pipeline. NON-BLOCKING: se falhar, pipeline continua.

observability:
  enabled: true                              # false desliga toda instrumentação
  log_level: "info"                          # debug | info | warn | error
  max_events: 10000                          # após isso, rotaciona (rename + novo)

  files:
    events_log: "pipeline/events.log"         # JSON Lines — append-only
    metrics_file: "pipeline/metrics.json"      # Contadores cumulativos

  tracking:
    events: true                              # log de transições e ações
    metrics: true                             # contadores cumulativos
    timing: true                              # duração de cada fase
    agents: true                              # quais agents foram usados
    tools: true                               # quais tools foram usadas
    retries: true                             # contagem de retries por fase
    tokens: true                              # LIGADO: tracking real de tokens (input/output separados via token-tracker.js)
