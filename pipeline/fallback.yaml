# Matrix Real Fallback Chain v1.0
# Fallback REAL e blockeante para chamadas de modelo
# Se o primeiro modelo falha, tenta o proximo automaticamente
#
# Diferenca do model-router.yaml:
#   model-router.yaml: define regras de SELECAO de modelo (qual usar)
#   fallback.yaml:     define a chain de EXECUCAO com fallback real
#
# Uso programatico:
#   const { ModelExecutor } = require('./scripts/model-executor');
#   const executor = new ModelExecutor({ timeout: 15000 });
#   const result = await executor.execute('code', 4, prompt);

fallback:
  # Habilita/desabilita o fallback chain globalmente
  enabled: true

  # Timeout padrao por modelo (em ms)
  # Se um modelo nao responder neste tempo, avanca para o proximo
  default_timeout: 15000  # 15s por modelo

  # ─── Chains de Fallback ──────────────────────────────────────────
  #
  # Cada chain define:
  #   description - Descricao do proposito da chain
  #   timeout     - Timeout maximo POR modelo (ms)
  #   models      - Lista ordenada de modelos a tentar
  #
  # A chain e selecionada automaticamente baseada na complexidade:
  #   complexity 1-2 -> cheap
  #   complexity 3   -> medium
  #   complexity 4-5 -> premium

  chains:
    # ── Cheap: Para tarefas simples ────────────────────────────────
    # Usado quando: complexity 1-2
    # Estrategia: comeca pelo gratuito, fallback para baixo custo
    cheap:
      description: "Para tarefas simples (complexity 1-2)"
      timeout: 15000
      models:
        - model: "oc/deepseek-v4-flash-free"
          description: "Gratuito, rapido, qualidade basica"
        - model: "gc/gemini-2.5-flash"
          description: "Baixo custo, qualidade media"

    # ── Medium: Para tarefas medias ─────────────────────────────────
    # Usado quando: complexity 3
    # Estrategia: comeca pelo balanceado, fallback para gratuito,
    # e premium como ultimo recurso
    medium:
      description: "Para tarefas medias (complexity 3)"
      timeout: 20000
      models:
        - model: "gc/gemini-2.5-flash"
          description: "Balanceado custo/qualidade"
        - model: "oc/deepseek-v4-flash-free"
          description: "Fallback gratuito"
        - model: "ag/claude-sonnet-4-6"
          description: "Alta qualidade se necessario"

    # ── Premium: Para tarefas complexas ─────────────────────────────
    # Usado quando: complexity 4-5
    # Estrategia: comeca pela maxima qualidade, fallback progressivo
    premium:
      description: "Para tarefas complexas (complexity 4-5)"
      timeout: 30000
      models:
        - model: "ag/claude-sonnet-4-6"
          description: "Alta qualidade"
        - model: "gc/gemini-2.5-flash"
          description: "Fallback medio"
        - model: "oc/deepseek-v4-flash-free"
          description: "Ultimo recurso"

  # ─── Logging ─────────────────────────────────────────────────────
  logging:
    # Nivel de log: "silent" | "error" | "info" | "debug"
    level: "info"

    # Logar cada tentativa de modelo (bem-sucedida ou nao)
    log_attempts: true

    # Logar detalhes de falhas (timeout, erro, resposta invalida)
    log_failures: true

    # Logar estatisticas agregadas ao final da execucao
    log_summary: true

  # ─── Comportamento ───────────────────────────────────────────────
  behavior:
    # Se true, lanca erro se TODOS os modelos falharem
    # Se false, retorna resultado parcial com warning
    strict_mode: true

    # Numero maximo de tentativas por modelo antes de considerar falha
    # (inclui retry automatico em caso de erro temporario)
    max_retries_per_model: 0

    # Timeout total maximo para toda a execucao (todas as tentativas)
    # 0 = sem limite (usa apenas timeout por modelo)
    global_timeout: 0

  # ─── Health Check ────────────────────────────────────────────────
  # Configuracoes para verificacao de saude dos modelos
  health_check:
    # Se true, verifica disponibilidade do modelo antes de usar
    enabled: false

    # Intervalo entre health checks (ms)
    interval_ms: 60000

    # Modelos a verificar (vazio = todos)
    models: []
